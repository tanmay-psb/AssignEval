<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Results – AES</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div id="layout-root" class="app-layout"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const student = checkAuth();
  if (student) {
    
    const resultsData = COURSES.map(c => {
       const asgmts = getAssignmentsByCourse(c.id);
       let courseTotalMarks = 0;
       let courseScoreScored = 0;
       let evaluatedCount = 0;
       
       asgmts.forEach(a => {
          if (getEffectiveStatus(a) === 'submitted') {
             const sub = getSubmission(a.id) || a;
             if (sub.score != null) {
                courseTotalMarks += a.maxMarks;
                courseScoreScored += (sub.score / 100) * a.maxMarks;
                evaluatedCount++;
             }
          }
       });
       
       const avgPct = evaluatedCount > 0 ? Math.round((courseScoreScored / courseTotalMarks) * 100) : null;
       return { course: c, evaluatedCount, avgPct };
    }).filter(x => x.evaluatedCount > 0);

    let content = `
      ${renderSidebar('results')}
      <main class="main-content">
        ${renderTopbar('Results & Feedback', 'View your scores and detailed evaluation reports')}
        <div class="page-body fade-in">
          
          <div class="card" style="margin-bottom:32px;">
            <div class="card-header"><div class="card-title">Course Performance Summary</div></div>
            <div style="overflow-x:auto;">
              <table class="results-table">
                <thead>
                  <tr>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Evaluated</th>
                    <th>Average Score</th>
                    <th>Performance Level</th>
                  </tr>
                </thead>
                <tbody>
                  ${resultsData.map(r => `
                    <tr>
                      <td style="font-weight:600;">${r.course.code}</td>
                      <td>${r.course.name}</td>
                      <td>${r.evaluatedCount} Assignments</td>
                      <td><span style="font-weight:700;font-size:16px;">${r.avgPct}%</span></td>
                      <td><div class="score-pill ${scoreColor(r.avgPct)}">${r.avgPct >= 80 ? 'Excellent' : r.avgPct >= 60 ? 'Satisfactory' : 'Needs Work'}</div></td>
                    </tr>
                  `).join('') || '<tr><td colspan="5" class="empty-state">No evaluated assignments yet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="section-header">
            <div class="section-title">Detailed Evaluations</div>
          </div>
          
          <div class="grid-2">
            ${ASSIGNMENTS.filter(a => {
              if (getEffectiveStatus(a) !== 'submitted') return false;
              const sub = getSubmission(a.id) || a;
              return sub.score != null;
            }).sort((a,b) => new Date(getSubmission(b.id)?.submittedAt || b.submittedAt) - new Date(getSubmission(a.id)?.submittedAt || a.submittedAt)).map(a => {
               const sub = getSubmission(a.id) || a;
               const c = getCourseById(a.courseId);
               
               return `
                 <div class="card card-hover" style="display:block;cursor:pointer;" onclick="window.location.href='assignment-detail.html?id=${a.id}'">
                   <div style="height:60px;background:var(--cream-100);border-radius:var(--radius) var(--radius) 0 0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--neutral-200);">
                     <div style="font-size:12px;font-weight:700;color:${c.color};text-transform:uppercase;">${c.code}</div>
                     <div style="font-size:12px;color:var(--neutral-500);">${formatDate(sub.submittedAt)}</div>
                   </div>
                   <div class="card-body" style="padding-top:20px;">
                     <div style="font-size:16px;font-weight:700;color:var(--neutral-900);line-height:1.3;margin-bottom:16px;font-family:'Plus Jakarta Sans',sans-serif;">${a.title}</div>
                     
                     <div style="display:flex;align-items:center;justify-content:space-between;background:var(--cream-50);padding:14px;border-radius:var(--radius-sm);border:1px solid var(--neutral-100);">
                       <div>
                         <div style="font-size:11px;color:var(--neutral-500);text-transform:uppercase;font-weight:600;margin-bottom:2px;">Final Score</div>
                         <div style="font-size:20px;font-weight:800;color:var(--orange-600);line-height:1;">${sub.score}<span style="font-size:14px;color:var(--neutral-400);">/100</span></div>
                       </div>
                       <div style="text-align:right;">
                         ${sub.plagiarismScore != null ? `<div style="font-size:11px;color:var(--neutral-500);margin-bottom:2px;">Plagiarism: <strong style="color:${sub.plagiarismScore<20?'var(--success)':'var(--danger)'}">${sub.plagiarismScore}%</strong></div>` : ''}
                         ${sub.aiScore != null && sub.aiScore > 30 ? `<div style="font-size:11px;color:var(--danger);font-weight:600;">⚠️ AI Flagged</div>` : ''}
                       </div>
                     </div>
                     <div style="margin-top:16px;font-size:13px;color:var(--orange-600);font-weight:600;text-align:center;">View Full Report →</div>
                   </div>
                 </div>
               `;
            }).join('')}
          </div>

        </div>
      </main>
    `;
    document.getElementById('layout-root').innerHTML = content;
  }
</script>
</body>
</html>
