<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile – AES</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div id="layout-root" class="app-layout"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const student = checkAuth();
  if (student) {
    const stats = getStudentStats();
    let content = `
      ${renderSidebar('profile')}
      <main class="main-content">
        ${renderTopbar('Student Profile', 'Manage your account details')}
        <div class="page-body fade-in">
          
          <div class="profile-hero">
            <div class="profile-avatar-lg">${student.initials}</div>
            <div class="profile-info">
              <h2>${student.name}</h2>
              <p>${student.email}</p>
              <div class="profile-tags">
                <span class="profile-tag">ID: ${student.id}</span>
                <span class="profile-tag">B.Tech IT</span>
                <span class="profile-tag">Year ${student.year}, Sem ${student.semester}</span>
              </div>
            </div>
            <div style="margin-left:auto;text-align:right;z-index:1;">
               <div style="font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Current CGPA</div>
               <div style="font-size:36px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;line-height:1;">${student.cgpa}</div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-header"><div class="card-title">Academic Details</div></div>
              <div class="card-body">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                  <div>
                    <div style="font-size:12px;color:var(--neutral-500);margin-bottom:4px;">Roll Number</div>
                    <div style="font-size:15px;font-weight:600;color:var(--neutral-900);">${student.rollNo}</div>
                  </div>
                  <div>
                    <div style="font-size:12px;color:var(--neutral-500);margin-bottom:4px;">Section</div>
                    <div style="font-size:15px;font-weight:600;color:var(--neutral-900);">${student.section}</div>
                  </div>
                  <div>
                    <div style="font-size:12px;color:var(--neutral-500);margin-bottom:4px;">Enrolled Courses</div>
                    <div style="font-size:15px;font-weight:600;color:var(--neutral-900);">${COURSES.length}</div>
                  </div>
                  <div>
                    <div style="font-size:12px;color:var(--neutral-500);margin-bottom:4px;">System Access Level</div>
                    <div style="font-size:15px;font-weight:600;color:var(--success);">Standard Student Access</div>
                  </div>
                </div>
              </div>
            </div>


          </div>
          
          <div style="margin-top:32px;text-align:center;">
             <button class="btn btn-danger" onclick="if(confirm('Are you sure you want to logout?')) logout()">Log Out of AES</button>
          </div>

        </div>
      </main>
    `;
    document.getElementById('layout-root').innerHTML = content;
  }
</script>
</body>
</html>
