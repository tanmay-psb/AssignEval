<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard – AES</title>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div id="layout-root" class="app-layout"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const student = checkAuth();
  if (student) {
    const stats = getStudentStats();
    let content = `
      ${renderSidebar('dashboard')}
      <main class="main-content">
        ${renderTopbar('Dashboard', 'Overview of your academic progress')}
        <div class="page-body fade-in">
          
          <div class="stats-grid">
            <div class="stat-card orange">
              <div class="stat-icon orange">📋</div>
              <div class="stat-info">
                <div class="stat-value">${stats.total}</div>
                <div class="stat-label">Total Assignments</div>
              </div>
            </div>
            <div class="stat-card green">
              <div class="stat-icon green">✅</div>
              <div class="stat-info">
                <div class="stat-value">${stats.submitted}</div>
                <div class="stat-label">Submitted</div>
              </div>
            </div>
            <div class="stat-card amber">
              <div class="stat-icon amber">⏳</div>
              <div class="stat-info">
                <div class="stat-value">${stats.pending}</div>
                <div class="stat-label">Pending</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">📈</div>
              <div class="stat-info">
                <div class="stat-value">${stats.avgScore}%</div>
                <div class="stat-label">Average Score</div>
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card fade-in fade-in-1">
              <div class="card-header">
                <div class="card-title">Upcoming Deadlines</div>
                <a href="assignments.html" class="btn btn-sm btn-outline">View All</a>
              </div>
              <div class="card-body" style="padding:10px 24px;">
                ${getUpcomingDeadlines(4).map(a => {
                  const tr = getTimeRemaining(a.deadline);
                  const c  = getCourseById(a.courseId);
                  return `
                    <div class="deadline-item">
                      <div class="deadline-dot" style="background:${c.color}"></div>
                      <div class="deadline-info">
                        <div class="deadline-name">${c.name}</div>
                        <div class="deadline-course">Assignment ${parseInt(a.id.slice(-3), 10)}</div>
                      </div>
                      <div class="deadline-time ${tr.cls}">${tr.text}</div>
                    </div>
                  `;
                }).join('') || '<div class="empty-state" style="padding:30px;"><div class="empty-icon">🎉</div><p>No upcoming deadlines!</p></div>'}
              </div>
            </div>

            <div class="card fade-in fade-in-2">
              <div class="card-header">
                <div class="card-title">Recent Submissions</div>
                <a href="results.html" class="btn btn-sm btn-outline">View Results</a>
              </div>
              <div class="card-body" style="padding:10px 24px;">
                ${ASSIGNMENTS.filter(a => getEffectiveStatus(a)==='submitted')
                   .sort((a,b) => new Date(getSubmission(a.id)?.submittedAt || a.submittedAt) < new Date(getSubmission(b.id)?.submittedAt || b.submittedAt) ? 1 : -1)
                   .slice(0, 4).map(a => {
                   const c = getCourseById(a.courseId);
                   const sub = getSubmission(a.id) || a;
                   const score = sub.score;
                   const sb = statusBadge('submitted');
                   return `
                     <div class="deadline-item">
                       <div class="deadline-dot" style="background:${c.color}"></div>
                       <div class="deadline-info">
                         <div class="deadline-name">${c.name}</div>
                         <div class="deadline-course">Assignment ${parseInt(a.id.slice(-3), 10)}</div>
                       </div>
                       <div style="text-align:right;">
                         <div class="badge ${sb.cls}" style="margin-bottom:4px;">${sb.icon} ${sb.label}</div>
                         ${score != null ? `<div style="font-size:12px;font-weight:700;color:var(--orange-600)">Score: ${score}/100</div>` : '<div style="font-size:12px;color:var(--neutral-400)">Pending Evaluation</div>'}
                       </div>
                     </div>
                   `;
                }).join('') || '<div class="empty-state" style="padding:30px;"><p>No submissions yet.</p></div>'}
              </div>
            </div>
          </div>
          
          <div class="section-header" style="margin-top:32px;">
            <div class="section-title">My Courses</div>
          </div>
          <div class="grid-3 fade-in fade-in-3">
            ${COURSES.map(c => {
               const asgmts = getAssignmentsByCourse(c.id);
               const p = asgmts.filter(a => getEffectiveStatus(a)==='pending').length;
               return `
                 <a href="assignments.html?course=${c.id}" class="card card-hover" style="display:block;">
                   <div class="card-body" style="padding:20px;">
                     <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
                        <div style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(249,115,22,.1);">${c.icon}</div>
                     </div>
                     <div style="font-size:16px;font-weight:700;color:var(--neutral-900);line-height:1.3;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif;">${c.name}</div>
                     <div style="font-size:12px;color:var(--neutral-500);">${c.code} • ${c.credits} Credits</div>
                   </div>
                 </a>
               `;
            }).join('')}
          </div>

        </div>
      </main>
    `;
    document.getElementById('layout-root').innerHTML = content;
  }
</script>
</body>
</html>
